# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false

## Environment Properties

# Проверьте актуальную версию на https://projects.neoforged.net/neoforged/neoforge (ветка 1.21.1)
# и подставьте её сюда перед сборкой, например: 21.1.172
neo_version=21.1.248
# Диапазон версий загрузчика NeoForge, см. https://docs.neoforged.net/docs/gettingstarted/versioning/
neo_version_range=[21.1,)
loader_version_range=[2,)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)

# Simple Voice Chat API (опциональная интеграция), см. https://maven.maxhenkel.de/#/releases/de/maxhenkel/voicechat/voicechat-api
voicechat_api_version=2.6.20

