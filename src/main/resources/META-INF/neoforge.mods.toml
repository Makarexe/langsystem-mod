modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mixins]]
config = "langsystem.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Опционально: если у игрока стоит Simple Voice Chat, включаем приглушение голоса на
# незнакомом языке (см. voicechat/LangSystemVoicechatPlugin.java). Без него мод работает
# как обычно — просто без этой функции.
[[dependencies."${mod_id}"]]
    modId = "voicechat"
    type = "optional"
    versionRange = "[2.5.0,)"
    ordering = "AFTER"
    side = "BOTH"
