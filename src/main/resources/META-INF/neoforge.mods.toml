modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mixins]]
config = "langsystem.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Опционально: если у игрока стоит Simple Voice Chat, включаем приглушение голоса на
# незнакомом языке (см. voicechat/LangSystemVoicechatPlugin.java). Без него мод работает
# как обычно — просто без этой функции.
# versionRange = "*" (не пустая строка!) — проверено на живом краше: пустая строка не
# означает "любая версия" в этой версии NeoForge, она трактуется как "ничего не подходит"
# и мод всё равно отказывался грузиться. "*" — рабочий синтаксис, подсмотренный у
# реального установленного мода (createpropulsion) с точно такой же opционал-зависимостью
# "любая версия, лишь бы был". Simple Voice Chat к тому же сообщает свою версию как строку
# вида "1.21.1-2.6.22" (с префиксом версии Minecraft), которая не сравнивается как обычный
# семвер — так что содержательный нижний порог всё равно нельзя было бы надёжно проверить.
[[dependencies."${mod_id}"]]
    modId = "voicechat"
    type = "optional"
    versionRange = "*"
    ordering = "AFTER"
    side = "BOTH"
